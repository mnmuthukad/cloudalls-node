<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Icon Diagnostic | CloudAlls</title>
<link rel="stylesheet" href="/assets/css/fontawesome.min.css?cb=fa7official">
<link rel="stylesheet" href="/assets/css/bootstrap.min.css">
<style>
body{font-family:system-ui,sans-serif;padding:24px;background:#f8fafc}
.giant{font-size:64px;color:#0f172a;margin:0 14px}
.card{border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:12px 0;background:#fff}
</style>
</head>
<body>
<h1>CloudAlls icon diagnostic</h1>

<div class="card">
  <h2>Brands (social icons) — 64px</h2>
  <i class="fa-brands fa-whatsapp giant"></i>
  <i class="fa-brands fa-linkedin-in giant"></i>
  <i class="fa-brands fa-x-twitter giant"></i>
  <i class="fa-brands fa-youtube giant"></i>
  <i class="fa-brands fa-instagram giant"></i>
  <i class="fa-brands fa-github giant"></i>
</div>

<div class="card">
  <h2>Solid icons — 64px</h2>
  <i class="fa-solid fa-phone giant"></i>
  <i class="fa-solid fa-envelope giant"></i>
  <i class="fa-solid fa-location-dot giant"></i>
  <i class="fa-solid fa-check giant"></i>
  <i class="fa-solid fa-bars-staggered giant"></i>
  <i class="fa-solid fa-arrow-right giant"></i>
</div>

<div class="card" id="result" style="background:#e2e8f0;font-family:monospace">Running font checks...</div>

<script>
async function run() {
  const out = [];
  const urls = [
    '/assets/css/fontawesome.min.css?cb=fa7official',
    '/assets/webfonts/fa-solid-900.woff2',
    '/assets/webfonts/fa-brands-400.woff2',
    '/assets/webfonts/fa-regular-400.woff2'
  ];
  for (const u of urls) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      out.push(u + ' -> HTTP ' + r.status);
    } catch (e) { out.push(u + ' -> ERROR ' + e.message); }
  }
  await document.fonts.ready;
  const brandsLoaded = document.fonts.check('48px "Font Awesome 7 Brands"', '\uf232');
  const solidLoaded = document.fonts.check('48px "Font Awesome 7 Free"', '\uf095');
  out.push('');
  out.push('Font "Font Awesome 7 Brands" (whatsapp glyph) loaded in this browser: ' + (brandsLoaded ? 'YES' : 'NO'));
  out.push('Font "Font Awesome 7 Free" (phone glyph) loaded in this browser: ' + (solidLoaded ? 'YES' : 'NO'));
  out.push('');
  out.push('Rendered icon widths (should be > 10px each):');
  document.querySelectorAll('.giant').forEach(i => {
    const w = i.getBoundingClientRect().width;
    out.push('  ' + (i.className || i.getAttribute('class')) + ' width=' + w.toFixed(1) + 'px');
  });
  const el = document.getElementById('result');
  el.style.background = (brandsLoaded && solidLoaded) ? '#dcfce7' : '#fee2e2';
  el.style.whiteSpace = 'pre';
  el.textContent = out.join('\n');
}
run().catch(e => { document.getElementById('result').textContent = 'ERROR: ' + e.message; });
</script>
</body>
</html>
